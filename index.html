<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="format-detection" content="telephone=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

      name="description"
      content="Design star and cross bathroom tile layouts"
    >
    <meta
      name="keywords"
      content="star and cross tile designer, star and cross tiles, cross and star tiles, mosaic tile layout, bathroom tile planner, arabesque tile, Spanish square tile, grout preview"
    >
    <meta name="author" content="Lucian Wischik">
    <meta name="application-name" content="Star and Cross Tile Designer">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#f4f1eb">
    <link rel="canonical" href="https://unto.me/tiles/">

    <meta property="og:title" content="Star and Cross Tile Designer">
    <meta
      property="og:description"
      content="Design star and cross bathroom tile layouts"
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://unto.me/tiles/">
    <meta property="og:site_name" content="Star and Cross Tile Designer">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="https://unto.me/tiles/preview.jpg">

    <meta name="twitter:card" content="summary_large_image">

      content="Design star and cross bathroom tile layouts"

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Star and Cross Tile Designer",
        "alternateName": "Star and Cross Tiles",
        "url": "https://unto.me/tiles/",
        "description": "Design star and cross bathroom tile layouts",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any modern browser",
        "isAccessibleForFree": true,
        "license": "https://unto.me/tiles/LICENSE",
        "keywords": [
          "star and cross tile designer",
          "mosaic tile layout",
          "bathroom tile planner",
          "arabesque tile",
          "Spanish square tile",
          "grout preview"
        ],
        "author": {
          "@type": "Person",
          "name": "Lucian Wischik"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <aside id="control-panel" class="panel">
      <h1>Star and Cross Tiles</h1>
      <div id="layout-errors" class="layout-errors" role="alert" aria-live="polite"></div>

      <section class="control-group" data-mobile-panel="layout">
        <h2>Layout</h2>
        <div class="layout-palette" aria-label="Layout palette">
          <label class="icon-button" data-tooltip="Straight layout">
            <input type="radio" name="mode" value="straight" checked aria-label="Straight layout">
            <svg class="layout-icon layout-grid-icon" viewBox="0 0 100 100" aria-hidden="true">
              <path d="M24.7 10v80M50 10v80M75.3 10v80M10 24.7h80M10 50h80M10 75.3h80"/>
            </svg>
          </label>
          <label class="icon-button" data-tooltip="Diagonal layout">
            <input type="radio" name="mode" value="diagonal" aria-label="Diagonal layout">
            <svg class="layout-icon layout-grid-icon" viewBox="0 0 100 100" aria-hidden="true">
              <path d="M90 19.3L80.7 10M90 55.2L44.8 10M10 11L89 90M10 46.8L53.2 90M10 82.7L17.3 90M10 27.3L27.3 10M10 63.2L63.2 10M90 19L19 90M90 54.8L54.8 90"/>
            </svg>
          </label>
          <div class="icon-half-gap" aria-hidden="true"></div>
          <label class="tool-button" data-tooltip="Grabber">
            <input type="radio" name="tool" value="grab" aria-label="Grabber">
            <svg class="tool-icon tool-icon-line" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M15 25V14a4 4 0 0 1 8 0v10-13a4 4 0 0 1 8 0v13-9a4 4 0 0 1 8 0v16c0 8-6 13-14 13h-3c-6 0-10-3-13-8l-4-7a4 4 0 0 1 7-4l3 5z"/>
            </svg>
          </label>
          <div class="icon-half-gap" aria-hidden="true"></div>
          <label class="icon-button" data-tooltip="No grid">
            <input type="radio" name="grid-layer" value="under" checked aria-label="No grid">
            <svg class="layout-icon layout-layer-icon" viewBox="0 0 100 100" aria-hidden="true">
              <path class="layer-grid" d="M12 50h76M50 12v76"/>
              <path class="layer-taco" d="M50 28 72 50 50 72 28 50z"/>
            </svg>
          </label>
          <label class="icon-button" data-tooltip="Grid">
            <input type="radio" name="grid-layer" value="top" aria-label="Grid">
            <svg class="layout-icon layout-layer-icon" viewBox="0 0 100 100" aria-hidden="true">
              <path class="layer-taco" d="M50 28 72 50 50 72 28 50z"/>
              <path class="layer-grid" d="M12 50h76M50 12v76"/>
            </svg>
          </label>
        </div>
        <div class="size-palette" aria-label="Tile size">
          <label class="icon-button" data-tooltip='8" x 8"'>
            <input type="radio" name="tile-size" value="8" aria-label='8" x 8"'>
            <svg class="size-icon" viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="10" width="80" height="80"/></svg>
          </label>
          <label class="icon-button" data-tooltip='7" x 7"'>
            <input type="radio" name="tile-size" value="7" aria-label='7" x 7"'>
            <svg class="size-icon" viewBox="0 0 100 100" aria-hidden="true"><rect x="15" y="15" width="70" height="70"/></svg>
          </label>
          <label class="icon-button" data-tooltip='6" x 6"'>
            <input type="radio" name="tile-size" value="6" aria-label='6" x 6"'>
            <svg class="size-icon" viewBox="0 0 100 100" aria-hidden="true"><rect x="20" y="20" width="60" height="60"/></svg>
          </label>
          <label class="icon-button" data-tooltip='5" x 5"'>
            <input type="radio" name="tile-size" value="5" aria-label='5" x 5"'>
            <svg class="size-icon" viewBox="0 0 100 100" aria-hidden="true"><rect x="25" y="25" width="50" height="50"/></svg>
          </label>
          <label class="icon-button" data-tooltip='4" x 4"'>
            <input type="radio" name="tile-size" value="4" aria-label='4" x 4"'>
            <svg class="size-icon" viewBox="0 0 100 100" aria-hidden="true"><rect x="30" y="30" width="40" height="40"/></svg>
          </label>
          <label class="icon-button" data-tooltip='3" x 3"'>
            <input type="radio" name="tile-size" value="3" aria-label='3" x 3"'>
            <svg class="size-icon" viewBox="0 0 100 100" aria-hidden="true"><rect x="35" y="35" width="30" height="30"/></svg>
          </label>
        </div>
        <div id="area-editor" class="area-editor">
          <label class="area-label" for="area-input">Area:</label>
          <input id="area-input" class="area-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
          <div class="area-actions" aria-label="Area edit actions">
            <button id="area-accept" class="area-action area-accept" type="button" aria-label="Accept area size">✓</button>
            <button id="area-cancel" class="area-action area-cancel" type="button" aria-label="Cancel area size">×</button>
          </div>
        </div>
      </section>

      <section class="control-group" data-mobile-panel="tiles">
        <h2>Tiles</h2>
        <div class="tool-palette" aria-label="Tile tools">
          <label class="tool-button" data-tooltip="Orthogonal cross">
            <input type="radio" name="paint-shape" value="orthogonalCross" checked aria-label="Orthogonal cross">
            <canvas class="tool-icon tool-icon-orthogonal material-tool-icon" width="100" height="100" data-tool-shape="orthogonalCross" aria-hidden="true"></canvas>
          </label>
          <label class="tool-button" data-tooltip="Diagonal cross">
            <input type="radio" name="paint-shape" value="diagonalCross" aria-label="Diagonal cross">
            <canvas class="tool-icon tool-icon-tile material-tool-icon" width="100" height="100" data-tool-shape="diagonalCross" aria-hidden="true"></canvas>
          </label>
          <label class="tool-button" data-tooltip="Star">
            <input type="radio" name="paint-shape" value="star" aria-label="Star">
            <canvas class="tool-icon tool-icon-star material-tool-icon" width="100" height="100" data-tool-shape="star" aria-hidden="true"></canvas>
          </label>
          <label class="tool-button" data-tooltip="Taco">
            <input type="radio" name="paint-shape" value="inset" aria-label="Taco">
            <canvas class="tool-icon tool-icon-taco material-tool-icon" width="100" height="100" data-tool-shape="inset" aria-hidden="true"></canvas>
          </label>
          <label class="tool-button" data-tooltip="Erase">
            <input type="radio" name="tool" value="erase" aria-label="Erase">
            <svg class="tool-icon tool-icon-eraser" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M8 31 28 11l12 12-15 15h-9z"/>
              <rect class="eraser-paper" x="16" y="39" width="24" height="3"/>
              <path d="M8 31 16 38h9l5-5"/>
              <path d="m18 21 12 12"/>
            </svg>
          </label>
          <button id="color-picker-tool" class="swatch color-picker-swatch" type="button" data-tooltip="Pick color" aria-label="Pick color" aria-pressed="false"></button>
        </div>
        <div id="palette" class="palette" aria-label="Color palette"></div>
      </section>

      <section class="control-group" data-mobile-panel="grout">
        <h2>Grout</h2>
        <div class="size-palette" aria-label="Grout size">
          <label class="icon-button" data-tooltip='1/16" grout'>
            <input type="radio" name="grout-joint" value="1" aria-label='1/16" grout'>
            <svg class="grout-icon" viewBox="0 0 100 100" aria-hidden="true"><path class="grout-width-1" d="M50 16v68M16 50h68"/></svg>
          </label>
          <label class="icon-button" data-tooltip='2/16" grout'>
            <input type="radio" name="grout-joint" value="2" aria-label='2/16" grout'>
            <svg class="grout-icon" viewBox="0 0 100 100" aria-hidden="true"><path class="grout-width-2" d="M50 16v68M16 50h68"/></svg>
          </label>
          <label class="icon-button" data-tooltip='3/16" grout'>
            <input type="radio" name="grout-joint" value="3" aria-label='3/16" grout'>
            <svg class="grout-icon" viewBox="0 0 100 100" aria-hidden="true"><path class="grout-width-3" d="M50 16v68M16 50h68"/></svg>
          </label>
          <label class="icon-button" data-tooltip='4/16" grout'>
            <input type="radio" name="grout-joint" value="4" aria-label='4/16" grout'>
            <svg class="grout-icon" viewBox="0 0 100 100" aria-hidden="true"><path class="grout-width-4" d="M50 16v68M16 50h68"/></svg>
          </label>
          <label class="icon-button" data-tooltip='6/16" grout'>
            <input type="radio" name="grout-joint" value="6" aria-label='6/16" grout'>
            <svg class="grout-icon" viewBox="0 0 100 100" aria-hidden="true"><path class="grout-width-6" d="M50 16v68M16 50h68"/></svg>
          </label>
          <label class="icon-button" data-tooltip='8/16" grout'>
            <input type="radio" name="grout-joint" value="8" aria-label='8/16" grout'>
            <svg class="grout-icon" viewBox="0 0 100 100" aria-hidden="true"><path class="grout-width-8" d="M50 16v68M16 50h68"/></svg>
          </label>
        </div>
        <div id="grout-palette" class="palette grout-palette" aria-label="Grout color palette"></div>
      </section>
    </aside>

    <main class="workspace">
      <div class="room-frame">
        <canvas id="room" aria-label="Tile painting canvas"></canvas>
        <dl class="room-specs" aria-label="Area size">
          <dd id="room-spec">60&quot; x 96&quot;</dd>
        </dl>
      </div>
    </main>

    <nav class="mobile-bottom-bar" aria-label="Controls">
      <button class="mobile-tab" type="button" data-mobile-panel-button="layout" aria-label="Layout controls" aria-pressed="false">
        <svg id="mobile-layout-icon" class="mobile-tab-icon" viewBox="0 0 48 48" aria-hidden="true"></svg>
        <span>Layout</span>
      </button>
      <button class="mobile-tab" type="button" data-mobile-panel-button="tiles" aria-label="Tile controls" aria-pressed="false">
        <canvas id="mobile-tile-icon" class="mobile-tab-icon mobile-tab-canvas" width="100" height="100" aria-hidden="true"></canvas>
        <span>Tiles</span>
      </button>
      <button class="mobile-tab" type="button" data-mobile-panel-button="grout" aria-label="Grout controls" aria-pressed="false">
        <svg id="mobile-grout-icon" class="mobile-tab-icon" viewBox="0 0 48 48" aria-hidden="true"></svg>
        <span>Grout</span>
      </button>
    </nav>

    <script defer src="main.js?v=touch-portrait"></script>
  </body>
</html>
